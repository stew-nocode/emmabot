# Déploie le widget Emma sur GitHub Pages : emma-widget.js, avatar, modèle d'intégration, README.
# AUCUN secret n'est publié. La page de test index.html et local.config.js restent locales :
# jusqu'au 14/09/2026, le site publiait en clair le secret en service du chat (local.config.js
# généré depuis EMMA_SECRET, et index.html). Un widget navigateur ne peut de toute façon pas
# garder de secret ; la protection du chat se fait côté n8n.
# Prérequis : Settings → Pages → Source : GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le dossier publié (_site)
        run: |
          mkdir -p _site
          cp emma-widget.js emma-avatar.png EMBED_SNIPPET.html README.md _site/
          : > _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
