<!-- ================================================================
     EMMA WIDGET 0.8.2 — Snippet d'intégration ERP
     À placer dans le <head> ou juste avant </body>.

     0.8.1 : la persistance de la conversation entre les écrans (besoin
     des ERP en navigation pleine page) est intégrée au widget. Elle
     s'active par `persistConversation` ci-dessous.

     0.8.2 : le CHARGEUR DE VERSION. Une ligne posée une fois, et les
     correctifs arrivent sans retouche chez l'intégrateur.
     ================================================================ -->

<!-- ─────────────────────────────────────────────────────────────────
     LE CHARGEUR — la ligne à poser, une fois.
     Il lit la version courante que nous publions et charge le widget
     correspondant : les correctifs arrivent sans ticket ni déploiement
     de votre côté. Si notre serveur de versions est indisponible, il
     charge une version de secours — le chat ne s'éteint pas.
     ───────────────────────────────────────────────────────────────── -->
<script src="https://widget.onnext-solution.com/emma/loader.js"></script>

<!-- ─────────────────────────────────────────────────────────────────
     REPRENDRE LA MAIN SUR LA VERSION, si jamais c'est nécessaire.
     Chaque version garde une adresse figée, jamais réécrite. Remplacer
     la ligne ci-dessus par celle-ci fige le widget pour de bon — et
     chaque mise à jour redevient alors une intervention manuelle.
     Utiliser l'une OU l'autre, jamais les deux.

     <script src="https://widget.onnext-solution.com/emma/0.8.2/emma-widget.js"></script>
     ───────────────────────────────────────────────────────────────── -->

<script>
  // Avec le chargeur, cet appel peut rester ICI, juste après la balise : le widget arrive
  // quelques dizaines de millisecondes plus tard et rejoue les appels reçus entre-temps.
  // Rien à décaler, rien à envelopper dans un window.onload.
  EmmaChat.init({

    // Avatar (optionnel) : par défaut emma-avatar.png est résolu depuis l’URL d’emma-widget.js (OK cross-domain ERP).
    // Avec le chargeur, laisser cette ligne commentée : l'avatar suit automatiquement la version chargée.
    // logoUrl: "https://widget.onnext-solution.com/emma/0.8.2/emma-avatar.png",

    // URL du webhook n8n qui reçoit les messages du chatbot.
    webhookUrl: "VOTRE_URL_WEBHOOK_N8N",

    // Route du workflow (correspond au path configuré dans le trigger n8n).
    webhookRoute: "general",

    // Secret partagé avec n8n pour authentifier les requêtes.
    // ⚠️ Visible côté client — pour une vraie sécurité, passer par un proxy backend.
    webhookHeaders: {
      "X-Emma-Secret": "VOTRE_SECRET_N8N"
    },

    // Identifiant stable de l'utilisateur connecté dans l'ERP.
    // Permet d'isoler la session par utilisateur et de tracer les échanges.
    // ⚠️ Ne PAS passer de sessionId : un identifiant imposé désactive la remise à zéro
    // après inactivité et le bouton « Nouvelle conversation » (la mémoire d'Emma serait conservée).
    userId: "ID_UTILISATEUR_ERP",

    // Identifiant de la session de connexion ERP (token, UUID…).
    erpSessionId: "ID_SESSION_ERP",

    // URL ou chemin de la page ERP affichée au moment du message.
    pageUrl: window.location.href,

    // (SPA uniquement) Décommenter à la place de pageUrl si l'URL change sans rechargement.
    // getPageUrl: () => window.location.pathname + window.location.search,

    // ── 0.8.1 : persistance de la conversation (ERP en navigation pleine page) ──
    // À LAISSER ACTIVÉ si chaque écran de l'ERP recharge le document : sans cela,
    // la conversation disparaîtrait à chaque clic de menu.
    // L'échange est rangé dans localStorage sous une clé suffixée par le sessionId :
    // il suit donc le sort de la session et disparaît avec elle. Aucun conflit avec
    // sessionIdleTimeoutMs ci-dessous, les deux se complètent.
    persistConversation: true,
    persistPanelOpen: true,

    // Nouveau (0.8.0) : délai sans message après lequel la conversation repart de zéro.
    // Défaut 2 heures ; 0 = jamais.
    // sessionIdleTimeoutMs: 2 * 60 * 60 * 1000,

    // Nouveau (0.8.0) : appelé au clic sur « Nouvelle conversation », après le délai d'inactivité,
    // ou via EmmaChat.newConversation(). Le widget ne conserve aucun message : si l'ERP en garde
    // une copie (ex. via onMessage), il doit la clôturer ici et ne jamais la réafficher à la connexion.
    onNewConversation: function (evt) {
      // evt.sessionId : identifiant de la nouvelle conversation
      // evt.raison    : "bouton" | "inactivite" | "api"
    }
  });

  // Nouveau (0.8.0), optionnel : repartir de zéro à la déconnexion de l'utilisateur (poste partagé).
  // EmmaChat.newConversation();
</script>
